<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc">
<title id="title">水龙祠五幅壁画路线草图</title><desc id="desc">基于设计模型坐标的候选路线；非现场测绘，部分段落未经通行检查。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#cba66c"/></marker></defs>
<rect width="1000" height="920" fill="#121d24"/><g font-family="Microsoft YaHei, sans-serif" fill="#e3ddd0"><text x="42" y="54" font-size="27">五幅壁画：模型路线草图</text><text x="42" y="82" font-size="15" fill="#b9b6ab">设计模型坐标 · 待验证 · 不代表历史观看顺序</text></g>
