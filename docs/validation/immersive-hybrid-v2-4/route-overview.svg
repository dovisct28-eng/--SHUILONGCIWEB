<g transform="translate(500 522) scale(24)" fill="none" stroke="#78858a" stroke-width=".06">
<rect x="-5" y="-15.5" width="10" height="27.5"/><rect x="-4.875" y="-15.35" width="9.75" height="7.2"/><rect x="-1.55" y="7.075" width="3.1" height="2.65"/>
<path d="M-5 -7.2H-3.2 M-5 -2.4H-3.2 M-5 2.4H-3.2 M-5 7.2H-3.2 M3.2 -7.2H5 M3.2 -2.4H5 M3.2 2.4H5 M3.2 7.2H5" stroke="#495b62" stroke-width=".035"/>
<g fill="#90755a" stroke="none"><circle cx="3.25" cy="7.2" r=".12"/><circle cx="3.25" cy="2.4" r=".12"/><circle cx="3.25" cy="-2.4" r=".12"/><circle cx="3.25" cy="-7.2" r=".12"/><circle cx="3.6" cy="-8.35" r=".15"/><circle cx="0" cy="-8.35" r=".15"/><circle cx="-3.6" cy="-8.35" r=".15"/></g>
<g stroke="#e0aa72" stroke-width=".18"><path d="M4.865 2.975V6.625"/><path d="M4.515 -14.8V-8.7"/><path d="M.575 -14.865H3.925"/><path d="M-3.925 -14.865H-.575"/><path d="M-4.515 -14.8V-8.7"/></g>
<path d="M0 12.8 L0 11.15 L3.85 9.7 L3.85 7.65 L3.85 0 L3.85 -6.5 L2.5 -7.5 L2.5 -9.5 L1.4 -11.75 L1.4 -12 L-1.4 -12 L-1.4 -11.75" stroke="#cba66c" stroke-width=".09" marker-mid="url(#arrow)" marker-end="url(#arrow)"/>
