</g>
<g font-family="Microsoft YaHei, sans-serif" fill="#e2d7c6" font-size="16"><text x="638" y="644">01 右廊</text><text x="628" y="244">02 主殿右墙</text><text x="552" y="151">03 后墙右</text><text x="350" y="151">04 后墙左</text><text x="241" y="244">05 主殿左墙</text><text x="458" y="863">大门 +Z</text><text x="457" y="725">戏台</text><text x="407" y="286">主殿</text><text x="42" y="100" fill="#cba66c">实线：候选正向段</text><text x="250" y="100" fill="#aebcba">虚线：回程设想，未核验</text><text x="42" y="900" font-size="14" fill="#b9b6ab">线段不代表最终相机轨道；相机视线、插值、楼梯和遮挡须另行验证。</text></g></svg>
