</style></head><body>
<header><div><h1>水龙祠建筑空间 · V2.4-B0</h1><p>独立模型候选，等待视觉确认 · 旧AI投影关闭</p></div><div class="controls"><label>模型 <select id="variant" aria-label="候选模型"></select></label><label>机位 <select id="view" aria-label="固定机位"><option value="aerial">整体鸟瞰</option><option value="front">正面入口</option><option value="interior">门内看戏台</option><option value="stage-right">戏台右侧</option><option value="corridor">右侧走廊</option><option value="discovery">第一幅斜向发现</option><option value="mural-front">第一幅正视</option><option value="hall-front">主殿正面</option><option value="hall-side">主殿侧面</option><option value="top">建筑俯视</option><option value="left-corridor">左侧走廊</option></select></label><label><input id="recenter" type="checkbox">候选居中机位</label><label><input id="wire" type="checkbox">构件线框</label><button id="shot">截图</button></div></header>
