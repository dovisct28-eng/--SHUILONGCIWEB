<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>内部视觉 V2 · 候选与实机对照</title><link rel="icon" href="data:,"><style>@font-face{font-family:s;src:url('../../../a01/fonts/a01-serif.woff2')}*{box-sizing:border-box}body{margin:0;padding:48px 4vw;background:#141b1e;color:#ded8cb;font:14px/1.8 'Microsoft YaHei',sans-serif}h1,h2{font-family:s,SimSun,serif;font-weight:400}h1{font-size:36px}h2{font-size:26px;margin:50px 0 18px}p{color:#b0b1a9;max-width:76em}a{color:#ded8cb}header{display:flex;justify-content:space-between;align-items:center}main{position:static}.row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.pair{grid-template-columns:1fr 1fr}figure{margin:0}img{display:block;width:100%;height:auto}figcaption{font-size:12px;color:#b0b1a9;margin-top:8px}.label{font-size:11px;color:#c7b79c;margin-bottom:7px}.notice{border-top:1px solid #8c8d824c;padding-top:22px}@media(max-width:1000px){.row{grid-template-columns:1fr 1fr}}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><header><div><p>内部数字展厅 / 视觉研究 V2</p><h1>从模型，到观看氛围。</h1></div><a href="./">返回交互原型 ↗</a></header><p>前两列 AI 方向均由对应的 Combined B 实机空墙渲染编辑生成。生成图仍有结构漂移，因此只从安全表面中提取视觉层。最右列是浏览器中的实际几何投影融合，建筑轮廓、壁画与遮挡来自原模型。</p><p class="notice">A · 自然质感更强调材料颗粒，部分地面接缝和墙脚处理偏重。B · 艺术氛围的明暗关系较柔和，本轮选为默认候选。整景 AI 图属于视觉参考，不能视为已经实现的动态整景。</p><div id="cameras"></div><h2>阅读版式 · 当前与候选</h2><div class="row pair"><figure><img src="../../../../docs/validation/interior-visual-v2/selected/before-reading.webp" alt="原版本完整阅读"><figcaption>当前正式版本 · 实际浏览器截图</figcaption></figure><figure><img src="../../../../docs/validation/interior-visual-v2/selected/03-mural-reading.webp" alt="V2 编辑式全幅阅读"><figcaption>V2 候选 · 扩大图像、重组信息，收起重复按钮</figcaption></figure></div><h2>局部细读 · 当前与候选</h2><div class="row pair"><figure><img src="../../../../docs/validation/interior-visual-v2/selected/before-detail.webp" alt="原版本图片查看器"><figcaption>当前正式版本 · 放大查看器</figcaption></figure><figure><img src="../../../../docs/validation/interior-visual-v2/selected/04-mural-detail.webp" alt="V2 位置索引和观察点"><figcaption>V2 候选 · 三处观察区域、长卷位置与自由缩放</figcaption></figure></div><script type="module">const names=['gate-interior','stage-turn','corridor-advance','mural-approach'],labels=['门内','戏台右转','走廊行进','第一铺接近'];document.querySelector('#cameras').innerHTML=names.map((n,i)=>`<section><h2>0${i+1} / ${labels[i]}</h2><div class="row">${[['模型参考',`../../assets/combined-b-transition/references/${n}.png`],['A · 自然质感',`./assets/candidates/${n}-A.webp`],['B · 艺术氛围',`./assets/candidates/${n}-B.webp`],['B · 实际表面融合',`./assets/comparisons/fused-${n}.webp`]].map(([label,url])=>`<figure><p class="label">${label}</p><a href="${url}" target="_blank"><img src="${url}" alt="${n} ${label}" loading="lazy"></a><figcaption>${label==='模型参考'?'1920×1080 / 固定参考机位':label.includes('实际')?'1920×1080 / 实际 WebGL 画布':'1672×941 / AI 生成图，仅作视觉参考'}</figcaption></figure>`).join('')}</div></section>`).join('');</script></body></html>
