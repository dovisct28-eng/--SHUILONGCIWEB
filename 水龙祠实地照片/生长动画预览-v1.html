<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水龙祠｜建筑生长动画预览</title>
  <style>
    :root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#26332e;background:#f4f2eb}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f4f2eb}
    .intro{min-height:100vh;display:grid;place-items:center;padding:48px 8vw;background:#f4f2eb}
    .intro-inner{max-width:620px;margin-right:auto}.eyebrow{font-size:12px;letter-spacing:.22em;color:#6b786d}
    h1{font-size:clamp(38px,6vw,80px);font-weight:500;line-height:1.05;margin:24px 0 28px;letter-spacing:.05em}
    p{font-size:16px;line-height:1.9;color:#5a665f;margin:0 0 32px}.hint{font-size:13px;color:#899188}
    .growth{height:430vh;position:relative}.stage{position:sticky;top:0;height:100vh;min-height:620px;overflow:hidden;display:grid;place-items:center;background:#f4f2eb}
    .art{position:relative;width:min(74vw,720px);height:min(94vh,900px);max-height:100%;aspect-ratio:1122/1402}
    .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;user-select:none;pointer-events:none}
    #foundation{opacity:1}.complete-wrap{position:absolute;inset:0;overflow:hidden;clip-path:inset(100% 0 0 0);transform:translateY(18px);opacity:.98;will-change:clip-path,transform}
    #complete{position:absolute;inset:0}.label{position:absolute;left:clamp(20px,7vw,110px);bottom:clamp(24px,7vh,82px);font-size:13px;letter-spacing:.12em;color:#6b786d;transition:opacity .25s}
    .progress{position:fixed;z-index:4;top:0;left:0;height:3px;width:100%;background:#d8d8ce}.progress i{display:block;width:0;height:100%;background:#586f61;transform-origin:left}
    .step{position:fixed;z-index:3;right:24px;bottom:24px;font-size:12px;letter-spacing:.12em;color:#778278;background:rgba(244,242,235,.8);padding:8px 10px;border:1px solid rgba(97,112,99,.25)}
    .end{min-height:70vh;display:grid;place-items:center;padding:60px 10vw;text-align:center;background:#eef0e9}.end p{max-width:580px}
    @media(max-width:700px){.art{width:min(92vw,520px);height:78vh}.intro{padding:36px 8vw}.step{right:12px;bottom:12px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.complete-wrap{transition:none!important}}
  </style>
</head>
<body>
  <div class="progress" aria-hidden="true"><i id="bar"></i></div>
  <section class="intro"><div class="intro-inner"><div class="eyebrow">水龙祠 · 建筑空间</div><h1>从地基<br>到建筑</h1><p>向下滚动，观看建筑从地基逐步显现。当前预览使用同一画布上的透明对齐素材，完整建筑不会重新绘制或改变结构。</p><div class="hint">滚动控制 · 可向上回退</div></div></section>
  <section class="growth" id="growth"><div class="stage"><div class="art" aria-label="水龙祠建筑从地基生长为完整建筑"><img id="foundation" src="../水龙祠建筑插画/生长动画素材/地基-透明对齐样张.png" alt="水龙祠地基"/><div class="complete-wrap" id="completeWrap"><img id="complete" src="../水龙祠建筑插画/生长动画素材/完整建筑-透明样张.png" alt="水龙祠完整建筑"/></div></div><div class="label" id="label">地基</div></div></section>
  <div class="step" id="step">01 / 04</div>
  <section class="end"><p>建筑完成。下一段叙事可以从这里进入建筑布局与壁画位置。</p></section>
  <script>
    (()=>{
      const growth=document.getElementById('growth'), wrap=document.getElementById('completeWrap'), bar=document.getElementById('bar'), label=document.getElementById('label'), step=document.getElementById('step');
      const labels=['地基','入口与廊屋','主殿成形','建筑完成'];
      function render(){
        const rect=growth.getBoundingClientRect(), max=Math.max(1,rect.height-innerHeight), p=Math.min(1,Math.max(0,-rect.top/max));
        const reveal=Math.min(1,Math.max(0,(p-.08)/.82));
        wrap.style.clipPath=`inset(${(1-reveal)*100}% 0 0 0)`;
        wrap.style.transform=`translateY(${(1-reveal)*18}px)`;
        bar.style.transform=`scaleX(${Math.min(1,(window.scrollY/(document.documentElement.scrollHeight-innerHeight))})`;
        const index=Math.min(3,Math.floor(reveal*4)); label.textContent=labels[index]; step.textContent=`0${index+1} / 04`;
        requestAnimationFrame(()=>{});
      }
      addEventListener('scroll',render,{passive:true}); addEventListener('resize',render); render();
    })();
  </script>
</body>
</html>
