<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1400" role="img" aria-labelledby="title desc">
  <title id="title">水龙祠 2.5D 建筑生长插画</title>
  <desc id="desc">依据用户俯视线稿绘制的设计化建筑插画。各构件按组分层，可用于生长动画；不是建筑测绘图。</desc>
  <defs>
    <pattern id="paving" width="42" height="22" patternUnits="userSpaceOnUse"><path d="M0 0H42M0 11H42M0 22H42M21 0V11M0 11V22M42 11V22" fill="none" stroke="#cfc7b9" stroke-width="1"/></pattern>
    <pattern id="tiles" width="12" height="28" patternUnits="userSpaceOnUse"><path d="M0 0V28M6 0V28M12 0V28" stroke="#4f5550" stroke-width="1.3" opacity=".65"/><path d="M0 6H12M0 20H12" stroke="#777a70" stroke-width=".7" opacity=".45"/></pattern>
    <pattern id="brick" width="34" height="16" patternUnits="userSpaceOnUse"><path d="M0 0H34M0 8H34M0 16H34M17 0V8M0 8V16M34 8V16" fill="none" stroke="#ad9e89" stroke-width=".8" opacity=".7"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="8" dy="12" stdDeviation="8" flood-color="#262a25" flood-opacity=".19"/></filter>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#f0e6d4"/><stop offset="1" stop-color="#d6c4a7"/></linearGradient>
    <linearGradient id="roof" x2="0" y2="1"><stop stop-color="#777c72"/><stop offset=".55" stop-color="#535a53"/><stop offset="1" stop-color="#343c39"/></linearGradient>
    <linearGradient id="yard" x2="0" y2="1"><stop stop-color="#f6f1e7"/><stop offset="1" stop-color="#e4ded1"/></linearGradient>
    <style>
      .edge{stroke:#373b36;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.fine{stroke:#61685e;stroke-width:1.4;fill:none}.eave{fill:none;stroke:#303832;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.highlight{fill:none;stroke:#e8e1ce;stroke-width:3;stroke-linecap:round}.pillar{fill:#d1bea0;stroke:#5b5a4f;stroke-width:2}
      svg.playing g[id]{transform-box:fill-box;transform-origin:center bottom}svg.playing #ground{animation:rise .65s both}svg.playing #entrance-wall{animation:rise .7s .35s both}svg.playing #side-walls{animation:rise .8s .8s both}svg.playing #side-roofs{animation:rise .95s 1.35s both}svg.playing #main-hall{animation:rise .9s 2s both}svg.playing #stage{animation:rise .8s 2.65s both}svg.playing #entrance-roof{animation:rise .85s 3.3s both}svg.playing #details{animation:fade .55s 3.9s both}
      @keyframes rise{from{opacity:0;transform:translateY(38px) scaleY(.84)}to{opacity:1;transform:translateY(0) scaleY(1)}}@keyframes fade{from{opacity:0}to{opacity:1}}
      @media(prefers-reduced-motion:reduce){svg.playing g{animation:none!important}}
    </style>
  </defs>
  <g id="ground">
    <path d="M219 72H901V1160H219Z" fill="#b5a78f" opacity=".34" filter="url(#shadow)"/>
    <path d="M242 266H878V1106H242Z" fill="url(#yard)" class="edge"/>
    <path d="M259 296H861V1082H259Z" fill="url(#paving)" opacity=".84"/>
    <path d="M380 308H740V1068H380Z" fill="none" stroke="#c6bda9" stroke-width="5"/>
    <path d="M392 322H728V1056H392Z" fill="none" stroke="#fdfaf4" stroke-width="4"/>
  </g>
  <g id="entrance-wall" filter="url(#shadow)">
    <path d="M202 1154H918V1322H202Z" fill="url(#wall)" class="edge"/>
    <path d="M216 1175H904V1306H216Z" fill="url(#brick)"/>
    <path d="M286 1319V1249Q286 1210 326 1210Q366 1210 366 1249V1319Z M520 1319V1239Q520 1190 560 1190Q600 1190 600 1239V1319Z M754 1319V1249Q754 1210 794 1210Q834 1210 834 1249V1319Z" fill="#4d5149" stroke="#756b5c" stroke-width="5"/>
    <path d="M294 1316V1250Q294 1218 326 1218Q358 1218 358 1250V1316 M528 1316V1242Q528 1198 560 1198Q592 1198 592 1242V1316 M762 1316V1250Q762 1218 794 1218Q826 1218 826 1250V1316" fill="none" stroke="#e6dac4" stroke-width="5"/>
    <path d="M326 1254V1317M560 1243V1317M794 1254V1317" stroke="#252c2b" stroke-width="3"/>
    <path d="M199 1321H921" stroke="#594f43" stroke-width="9"/>
  </g>
  <g id="side-walls">
    <path d="M217 234L326 258V1102H217Z M794 258L903 234V1102H794Z" fill="url(#wall)" class="edge"/>
    <path d="M226 272V1089M894 272V1089" stroke="#ad9e88" stroke-width="5"/>
    <path d="M332 280V1073M788 280V1073" stroke="#6c6758" stroke-width="5"/>
    <path d="M345 340V1070M775 340V1070" stroke="#c6b394" stroke-width="7"/>
    <path d="M345 340V1070M775 340V1070" stroke="#6f6a59" stroke-width="1.5"/>
  </g>
  <g id="side-roofs" filter="url(#shadow)">
    <path d="M232 244L292 244L364 271V1075L292 1053L232 1078Z M888 244L828 244L756 271V1075L828 1053L888 1078Z" fill="url(#roof)" class="edge"/>
    <path d="M232 244L292 244L364 271V1075L292 1053L232 1078Z M888 244L828 244L756 271V1075L828 1053L888 1078Z" fill="url(#tiles)" opacity=".56"/>
    <path d="M292 246V1053M828 246V1053" class="eave"/>
    <path d="M235 244V1078M885 244V1078" class="highlight"/>
    <path d="M364 271V1075M756 271V1075" class="eave"/>
  </g>
  <g id="main-hall" filter="url(#shadow)">
    <path d="M240 75H880V320H240Z" fill="url(#wall)" class="edge"/>
    <path d="M260 245H860V316H260Z" fill="#e7ddcb" stroke="#5e5d52" stroke-width="3"/>
    <path d="M355 250V315M457 250V315M560 250V315M663 250V315M765 250V315" stroke="#6f6e62" stroke-width="8"/>
    <path d="M232 74Q242 56 264 61L856 61Q878 56 888 74L902 243Q887 263 866 242L849 91H271L254 242Q233 263 218 243Z" fill="url(#roof)" class="edge"/>
    <path d="M232 74Q242 56 264 61L856 61Q878 56 888 74L902 243Q887 263 866 242L849 91H271L254 242Q233 263 218 243Z" fill="url(#tiles)" opacity=".54"/>
    <path d="M271 91H849M256 241H864" class="eave"/>
    <path d="M225 239Q251 256 273 209M895 239Q869 256 847 209M232 74Q220 57 228 34Q233 19 245 31Q250 57 271 69M888 74Q900 57 892 34Q887 19 875 31Q870 57 849 69" class="eave"/>
    <path d="M273 79H847" class="highlight"/>
  </g>
  <g id="stage" filter="url(#shadow)">
    <path d="M449 922H671V1070H449Z" fill="url(#wall)" class="edge"/>
    <path d="M450 934Q461 920 480 928L640 928Q659 920 670 934L687 1037Q668 1055 653 1036L638 963H482L467 1036Q452 1055 433 1037Z" fill="url(#roof)" class="edge"/>
    <path d="M450 934Q461 920 480 928L640 928Q659 920 670 934L687 1037Q668 1055 653 1036L638 963H482L467 1036Q452 1055 433 1037Z" fill="url(#tiles)" opacity=".52"/>
    <path d="M480 962H640M434 1037Q457 1049 480 1018M686 1037Q663 1049 640 1018" class="eave"/>
    <path d="M451 932Q438 919 443 904M669 932Q682 919 677 904" class="eave"/>
  </g>
  <g id="entrance-roof" filter="url(#shadow)">
    <path d="M217 1065H903V1162H217Z" fill="url(#roof)" class="edge"/>
    <path d="M217 1065H903V1162H217Z" fill="url(#tiles)" opacity=".68"/>
    <path d="M211 1065H909M207 1161H913" class="eave"/>
    <path d="M211 1078H909" class="highlight"/>
  </g>
  <g id="details">
    <path d="M213 1169H907" stroke="#d5c6aa" stroke-width="5"/>
    <path d="M226 250V1090M894 250V1090" stroke="#f1e6d2" stroke-width="2" opacity=".8"/>
    <path d="M371 300V1057M749 300V1057" stroke="#9e9a86" stroke-width="3" opacity=".55"/>
    <circle cx="326" cy="1272" r="2" fill="#d7ccb6"/><circle cx="560" cy="1262" r="2" fill="#d7ccb6"/><circle cx="794" cy="1272" r="2" fill="#d7ccb6"/>
  </g>
</svg>
